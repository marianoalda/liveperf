<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>liveperf · editor</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header class="top">
    <div class="brand">
      <h1>liveperf</h1>
      <span class="muted">editor local · jerarquía y etiquetas de botón</span>
    </div>
    <div class="top-actions">
      <div class="mode-tabs" role="tablist">
        <button type="button" id="mode-tree" class="mode-tab active">Jerarquía</button>
        <button type="button" id="mode-labels" class="mode-tab">Etiquetas</button>
      </div>
      <button type="button" id="btn-save" class="primary" disabled>Guardar</button>
      <span id="status" class="status"></span>
    </div>
  </header>

  <main class="layout">
    <aside class="panel files">
      <h2>Ficheros</h2>
      <p class="hint">Se guardan en <code>libraries/</code> del repo.</p>
      <div class="row">
        <input id="new-file" type="text" placeholder="nuevo.json" />
        <button type="button" id="btn-new">Crear</button>
      </div>
      <ul id="file-list" class="list"></ul>
    </aside>

    <section class="panel tree" id="panel-tree">
      <h2 id="tree-title">Grupos</h2>
      <div id="tree-toolbar" class="row">
        <input id="new-group" type="text" placeholder="Nombre del grupo" />
        <button type="button" id="btn-add-group">Añadir</button>
      </div>
      <ul id="group-list" class="list"></ul>
    </section>

    <section class="panel detail" id="panel-detail">
      <p class="empty">Abre o crea un fichero JSON para editar.</p>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
